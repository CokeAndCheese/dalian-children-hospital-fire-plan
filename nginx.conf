server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index fire-rescue-cockpit.html;

    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/llm/chat/completions {
        client_max_body_size 128k;
        proxy_pass http://ai:3000;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-AI-Access-Code $http_x_ai_access_code;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /api/ { return 404; }

    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|wasm|glb|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /fire-rescue-cockpit.html;
    }
}
