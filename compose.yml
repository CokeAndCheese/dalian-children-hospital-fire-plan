name: dalian-children-hospital-fire-plan

services:
  web:
    build:
      context: .
      target: web
    image: dalian-children-hospital-fire-plan:local
    container_name: dalian-children-hospital-fire-plan
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web
      - backend
    depends_on:
      ai:
        condition: service_healthy

  ai:
    build:
      context: .
      target: ai
    image: dalian-children-hospital-fire-plan-ai:local
    container_name: dalian-children-hospital-fire-plan-ai
    restart: unless-stopped
    env_file:
      - ${AI_ENV_FILE:-/srv/secrets/dalian-children-hospital-fire-plan/llm.env}
    expose:
      - "3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ai-budget:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend

networks:
  backend:
  web:
    external: true
    name: web

volumes:
  ai-budget:
